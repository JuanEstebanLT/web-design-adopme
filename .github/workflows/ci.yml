name: Validación continua

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar estilo y código
        run: npm run lint

      - name: Validar esquema Prisma
        run: npm run prisma:validate

      - name: Auditar dependencias
        run: npm audit

      - name: Auditar dependencias de producción
        run: npm audit --omit=dev

      - name: Compilar aplicación
        run: npm run build
